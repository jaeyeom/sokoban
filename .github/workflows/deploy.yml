# Deploys the commit that passed CI on main. Pull requests do not deploy.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check deploy secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_BUCKET: ${{ secrets.GCP_BUCKET }}
        run: |
          missing=""
          if [ -z "$GCP_PROJECT_ID" ]; then
            missing="$missing GCP_PROJECT_ID"
          fi
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]; then
            missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          fi
          if [ -z "$GCP_SERVICE_ACCOUNT" ]; then
            missing="$missing GCP_SERVICE_ACCOUNT"
          fi
          if [ -z "$GCP_BUCKET" ]; then
            missing="$missing GCP_BUCKET"
          fi
          if [ -n "$missing" ]; then
            printf '%s\n' "Missing GitHub secrets:$missing" >&2
            exit 1
          fi

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-node@v6
        with:
          node-version-file: data/app/.nvmrc
          cache: npm
          cache-dependency-path: data/app/package-lock.json

      - run: npm ci
        working-directory: data/app

      - name: Write app.yaml
        env:
          BUCKET: ${{ secrets.GCP_BUCKET }}
        run: |
          awk -v bucket="$BUCKET" '{gsub("your-bucket-name.appspot.com", bucket); print}' app.yaml.example > app.yaml

      - run: make deploy
